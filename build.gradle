plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'techguns'
version = mod_version
base { archivesName = 'Techguns-1.21.1-NeoForge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def flag = { String name -> providers.gradleProperty(name).getOrElse('false').toBoolean() }

repositories {
    maven { url = 'https://maven.blamejared.com' }   // Patchouli, JEI
    maven { url = 'https://maven.parchmentmc.org' }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
            logLevel = org.slf4j.event.Level.INFO
            gameDirectory = project.file('run')
        }
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', 'techguns', '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        techguns { sourceSet(sourceSets.main) }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // Optional in the development client: gradlew runClient -PwithJei=true -PwithPatchouli=true
    if (flag('withJei')) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
    if (flag('withPatchouli')) {
        localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"
    }

    // The Techguns manual is a Patchouli book. Patchouli (CC BY-NC-SA 3.0, by Vazkii) is shipped inside the mod jar
    // (Jar-in-Jar), so the book works without installing it separately; a newer separately installed Patchouli wins.
    jarJar("vazkii.patchouli:Patchouli") {
        version {
            strictly "[${patchouli_version},)"
            prefer patchouli_version
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
        mod_version: project.version,
        minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
tasks.named('jar', Jar).configure {
    manifest { attributes 'Implementation-Title': 'Techguns', 'Implementation-Version': project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
